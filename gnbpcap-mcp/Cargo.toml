[package]
name = "gnbpcap-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
gnbpcap-core = { path = "../gnbpcap-core" }
rmcp = { version = "3.4", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
